<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">10 m air gun range (side view)</title>
  <desc id="desc">Schematic side view of a 10 meter indoor air gun range: an athlete at a one meter wide firing point shoots from the standing position at a target 10 meters downrange. Illustrative schematic, not to scale.</desc>
  <rect x="0" y="0" width="1000" height="420" fill="#f4f1ea"/>
  <!-- floor -->
  <rect x="30" y="330" width="940" height="40" fill="#8a7a66" stroke="#5b503f" stroke-width="2"/>
  <!-- range area -->
  <rect x="30" y="150" width="940" height="180" fill="#e8e2d4" stroke="#b5a98f" stroke-width="2"/>
  <!-- 10 m distance arrow -->
  <line x1="180" y1="318" x2="880" y2="318" stroke="#3b2415" stroke-width="3"/>
  <polygon points="180,310 180,326 160,318" fill="#3b2415"/>
  <polygon points="880,310 880,326 900,318" fill="#3b2415"/>
  <text x="530" y="308" fill="#3b2415" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">10 m</text>
  <!-- athlete, standing, one or two hands depending on event -->
  <g fill="#3b2415" stroke="#3b2415" transform="translate(155 0)">
    <circle cx="0" cy="150" r="14" fill="#3b2415"/>
    <rect x="-6" y="164" width="12" height="86" rx="4" fill="#4a5b7a"/>
    <line x1="-2" y1="168" x2="-16" y2="220" stroke="#3b2415" stroke-width="7" stroke-linecap="round"/>
    <line x1="4" y1="168" x2="26" y2="160" stroke="#3b2415" stroke-width="7" stroke-linecap="round"/>
    <line x1="-2" y1="250" x2="-12" y2="326" stroke="#3b2415" stroke-width="9" stroke-linecap="round"/>
    <line x1="4" y1="250" x2="16" y2="326" stroke="#3b2415" stroke-width="9" stroke-linecap="round"/>
    <!-- air gun held out toward the target -->
    <rect x="20" y="150" width="52" height="7" rx="3" fill="#222222"/>
  </g>
  <text x="155" y="392" fill="#3b2415" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">FIRING POINT (1 m wide)</text>
  <!-- target line -->
  <line x1="895" y1="150" x2="895" y2="330" stroke="#b5a98f" stroke-width="6"/>
  <!-- target with rings -->
  <g transform="translate(895 200)">
    <circle cx="0" cy="0" r="70" fill="#ffffff" stroke="#b5a98f" stroke-width="3"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#999999" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#999999" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#999999" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#111111"/>
  </g>
  <text x="895" y="392" fill="#3b2415" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">TARGET</text>
  <text x="895" y="122" fill="#3b2415" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">TARGET LINE</text>
  <text x="500" y="60" fill="#5b3a24" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Indoor 10 m air gun range (air rifle and air pistol)</text>
  <text x="500" y="86" fill="#5b3a24" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Standing position, electronic targets at ISSF championships; air pistol is shot one-handed.</text>
</svg>
